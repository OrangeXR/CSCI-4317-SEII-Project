{% extends "0-base-login.html" %}
{% block content %}

<div class="login-container">

    <!-- LEFT IMAGE PANEL -->
    <div class="login-left"></div>

    <!-- RIGHT PANEL -->
    <div class="login-right">

        <h1 class="login-title">Assignment Tracker</h1>

        <div class="login-box">

            <h2>Login</h2>

            {% if error %}
            <p style="color:red;">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <label>Username:</label>
                <input type="text" name="username">

                <label>Password:</label>
                <input type="password" name="password">

                <button type="submit">Login</button>
            </form>

            <a href="{{ url_for('register') }}" class="create-account">
                Create an account
            </a>

        </div>
    </div>

</div>

{% endblock %}
